version: '3.8'

services:
  # PostgreSQL with pgvector extension
  aegis_db:
    image: ankane/pgvector:latest
    container_name: aegis_postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecUrE_Aegis_PaSsWoRd_2026}
      POSTGRES_DB: aegis_rag
      PGDATA: /var/lib/postgresql/data/pgdata
    
    ports:
      - "5432:5432"
    
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - aegis_network
    
    security_opt:
      - no-new-privileges:true

  # Redis for caching and session storage
  aegis_redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-aegis_redis_secure_2026}
    
    ports:
      - "6379:6379"
    
    volumes:
      - redisdata:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - aegis_network
    
    security_opt:
      - no-new-privileges:true

  # FastAPI Application
  aegis_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: aegis_app
    restart: unless-stopped
    
    depends_on:
      aegis_db:
        condition: service_healthy
      aegis_redis:
        condition: service_healthy
    
    environment:
      # Application
      APP_VERSION: 2.0.0
      DEBUG: "false"
      
      # Database
      DB_HOST: aegis_db
      DB_PORT: 5432
      DB_NAME: aegis_rag
      DB_USER: aegis_admin
      DB_PASSWORD: ${DB_PASSWORD:-SecUrE_Aegis_PaSsWoRd_2026}
      DB_POOL_SIZE: 10
      DB_POOL_RECYCLE: 3600
      DB_CONNECTION_TIMEOUT: 30
      DB_QUERY_TIMEOUT: 60
      
      # Redis
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-aegis_redis_secure_2026}@aegis_redis:6379/0
      REDIS_TTL: 3600
      
      # Model
      ENCODER_MODEL: all-MiniLM-L6-v2
      VECTOR_THRESHOLD: 0.3
      TOP_K_RESULTS: 5
      
      # Security
      ALLOWED_HOSTS: '["localhost", "aegis_app", "0.0.0.0"]'
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
      RATE_LIMIT_PER_MINUTE: 100
      
      # Logging
      LOG_LEVEL: INFO
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./app:/app/app:ro
      - ./logs:/app/logs
    
    networks:
      - aegis_network
    
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    
    cap_add:
      - NET_BIND_SERVICE
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis_prometheus
    restart: unless-stopped
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    
    ports:
      - "9090:9090"
    
    networks:
      - aegis_network
    
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  prometheus_data:
    driver: local

networks:
  aegis_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16